# NEXUS Fraud Detection deployment stack.
#
# NOTE: the MySQL database runs as the external `mysql-server` container
# (mysql:8.0) on host port 3306 — it holds the live data and is deliberately
# NOT managed here. The app connects to it via the DATABASE_URL in .env.
#
#   docker compose up -d --build
services:
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - nexus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexus-fraud-detection:latest
    container_name: nexus-app
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      # Inside the compose network, Redis is reachable by service name.
      REDIS_URL: "redis://redis:6379"
      PORT: "3002"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # 401 from the ingest probe means the server is up (secret required).
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:3002/api/n8n/whatsapp').then(r=>process.exit(r.status===401||r.status===200?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  nexus_redis_data:
